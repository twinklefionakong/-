<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>银行半年报证据台</title>
  <style>
    :root { --ink:#13243a; --muted:#607086; --line:#ccd6e2; --paper:#f8fafc; --white:#fff; --blue:#1459a6; --blue2:#0b3567; --cyan:#a8e3ec; --warm:#f3b562; }
    * { box-sizing:border-box; }
    body { margin:0; color:var(--ink); background:linear-gradient(135deg,#eaf2f8 0,#f8fafc 38%,#e8f1f4 100%); font-family:"PingFang SC","Microsoft YaHei",sans-serif; min-height:100vh; }
    button,input { font:inherit; }
    .shell { max-width:1180px; margin:auto; padding:28px 24px 64px; }
    header { display:grid; grid-template-columns:1fr auto; align-items:end; padding:24px 0 22px; border-bottom:1px solid #9fb1c5; }
    .eyebrow { color:var(--blue); letter-spacing:.16em; font-size:12px; font-weight:700; }
    h1 { margin:7px 0 0; font-family:"Songti SC","STSong",serif; font-size:clamp(34px,5vw,62px); line-height:1; letter-spacing:-.04em; }
    .stats { display:flex; gap:26px; }
    .stat strong { display:block; font-family:Georgia,serif; font-size:24px; color:var(--blue2); }
    .stat span { color:var(--muted); font-size:12px; }
    main { display:grid; grid-template-columns:minmax(0,1.55fr) minmax(290px,.75fr); gap:22px; margin-top:28px; align-items:start; }
    .desk,.side { background:rgba(255,255,255,.86); border:1px solid var(--line); box-shadow:0 18px 45px rgba(37,64,92,.09); }
    .desk { padding:30px; }
    .side { padding:22px; position:sticky; top:20px; }
    .label { display:flex; justify-content:space-between; color:var(--muted); font-size:13px; margin-bottom:10px; }
    .label b { color:var(--blue); letter-spacing:.08em; }
    .ask { display:flex; border:2px solid var(--blue2); background:#fff; transition:.2s; }
    .ask:focus-within { box-shadow:0 0 0 4px rgba(20,89,166,.13); }
    input { flex:1; border:0; outline:0; padding:17px 18px; color:var(--ink); min-width:0; }
    button { border:0; padding:0 25px; color:#fff; background:var(--blue); cursor:pointer; font-weight:700; }
    button:hover { background:var(--blue2); }
    button:disabled { opacity:.55; cursor:wait; }
    .examples { display:flex; flex-wrap:wrap; gap:8px; margin:14px 0 0; }
    .chip { padding:7px 10px; border:1px solid var(--line); background:#f6f9fc; color:var(--blue2); font-size:12px; font-weight:500; }
    .chip:hover { background:#e8f1fa; }
    .answer { margin-top:30px; border-top:1px solid var(--line); padding-top:25px; display:none; }
    .answer h2,.evidence-head h2 { font:700 15px/1.2 "PingFang SC",sans-serif; letter-spacing:.08em; margin:0; }
    .answer-text { white-space:pre-wrap; line-height:1.85; margin:16px 0 0; font-family:"Songti SC","STSong",serif; font-size:17px; }
    .evidence-head { display:flex; justify-content:space-between; align-items:center; margin-top:32px; }
    .evidence-head span { color:var(--muted); font-size:12px; }
    .card { border-top:1px solid var(--line); padding:20px 0; }
    .card:first-child { margin-top:12px; }
    .meta { display:flex; align-items:center; flex-wrap:wrap; gap:8px; font-size:12px; color:var(--muted); }
    .rank { display:grid; place-items:center; width:27px; height:27px; border-radius:50%; background:var(--blue2); color:#fff; font:700 13px Georgia,serif; }
    .company { color:var(--ink); font-weight:700; font-size:14px; }
    .type { border:1px solid #aac2d8; padding:2px 6px; color:var(--blue); }
    .excerpt { margin:13px 0 11px; line-height:1.7; color:#33455a; font-size:14px; display:-webkit-box; -webkit-line-clamp:4; -webkit-box-orient:vertical; overflow:hidden; }
    .source { color:var(--blue); text-decoration:none; font-size:13px; font-weight:700; }
    .source:hover { text-decoration:underline; }
    .side h3 { margin:0 0 18px; font-size:14px; letter-spacing:.08em; }
    .flow { margin:0; padding:0; list-style:none; counter-reset:flow; }
    .flow li { counter-increment:flow; position:relative; padding:0 0 18px 39px; color:var(--muted); font-size:13px; line-height:1.5; }
    .flow li:before { content:counter(flow); position:absolute; left:0; top:-2px; width:24px; height:24px; display:grid; place-items:center; border:1px solid var(--blue); color:var(--blue); border-radius:50%; font:12px Georgia,serif; }
    .flow li:not(:last-child):after { content:""; position:absolute; left:12px; top:24px; bottom:0; border-left:1px solid #b8c8d7; }
    .legend { background:var(--blue2); color:#fff; margin:8px -22px -22px; padding:20px 22px; }
    .legend small { color:#b9cee3; display:block; margin-bottom:6px; }
    .legend p { margin:0; font:15px/1.6 "Songti SC",serif; }
    .loading { display:none; margin:28px 0; color:var(--blue); }
    .loading:before { content:""; display:inline-block; width:9px; height:9px; margin-right:9px; border-radius:50%; background:var(--blue); animation:pulse 1s infinite alternate; }
    .error { color:#9b2c2c; background:#fff0f0; border:1px solid #e8bcbc; padding:12px; margin-top:18px; display:none; }
    @keyframes pulse { to { transform:scale(1.7); opacity:.35; } }
    @media(max-width:820px){ header{display:block}.stats{margin-top:22px}main{grid-template-columns:1fr}.side{position:static;order:-1}.desk{padding:20px}.ask{display:block}.ask button{width:100%;height:48px}.shell{padding:16px 14px 40px} }
    @media(prefers-reduced-motion:reduce){ *{animation:none!important;transition:none!important} }
  </style>
</head>
<body>
  <div class="shell">
    <header>
      <div><div class="eyebrow">2026 H1 · FINANCIAL EVIDENCE DESK</div><h1>银行半年报证据台</h1></div>
      <div class="stats"><div class="stat"><strong>11</strong><span>家银行</span></div><div class="stat"><strong>11,260</strong><span>个内容块</span></div></div>
    </header>
    <main>
      <section class="desk">
        <form id="form">
          <div class="label"><b>输入问题</b><span>答案仅依据已收录半年报</span></div>
          <div class="ask"><input id="query" autocomplete="off" placeholder="例如：工商银行2026年上半年营业收入是多少？" aria-label="问题"><button id="submit">查找答案</button></div>
          <div class="examples">
            <button class="chip" type="button">招商银行上半年营业收入是多少？</button>
            <button class="chip" type="button">比较招商银行、建设银行和工商银行的营业收入</button>
            <button class="chip" type="button">成都银行的不良贷款率是多少？</button>
          </div>
        </form>
        <div class="loading" id="loading">正在核对向量索引与原文证据…</div><div class="error" id="error"></div>
        <section class="answer" id="answer"><div class="label"><b>证据答案</b><span id="time"></span></div><div class="answer-text" id="answerText"></div><div class="evidence-head"><h2>引用与召回记录</h2><span>按融合相关度排序</span></div><div id="results"></div></section>
      </section>
      <aside class="side"><h3>证据如何到达这里</h3><ol class="flow"><li>用 BGE 中文向量寻找语义相近段落</li><li>用 BM25 补足公司名、指标名与精确数字</li><li>融合排序，并优先保留集团合并口径</li><li>答案标注引用编号，可回到 PDF 原页核对</li></ol><div class="legend"><small>使用原则</small><p>没有证据就不补写。数字、单位与统计口径以引用原文为准。</p></div></aside>
    </main>
  </div>
  <script>
    const form=document.querySelector('#form'), query=document.querySelector('#query'), submit=document.querySelector('#submit'), loading=document.querySelector('#loading'), errorBox=document.querySelector('#error'), answer=document.querySelector('#answer'), answerText=document.querySelector('#answerText'), results=document.querySelector('#results');
    document.querySelectorAll('.chip').forEach(chip=>chip.addEventListener('click',()=>{query.value=chip.textContent;form.requestSubmit()}));
    const esc=s=>String(s).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
    form.addEventListener('submit',async event=>{event.preventDefault(); const q=query.value.trim(); if(!q)return; const start=performance.now(); submit.disabled=true;loading.style.display='block';errorBox.style.display='none';answer.style.display='none';
      try{const response=await fetch('/api/search',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({query:q})});const data=await response.json();if(!response.ok)throw new Error(data.error||'检索失败');answerText.textContent=data.answer;results.innerHTML=data.results.map(r=>`<article class="card"><div class="meta"><span class="rank">${r.rank}</span><span class="company">${esc(r.company)}</span><span>${esc(r.section)}</span><span class="type">${r.content_type==='table'?'表格':'正文'}</span><span>RRF ${Number(r.score).toFixed(4)}</span></div><p class="excerpt">${esc(r.content)}</p><a class="source" target="_blank" href="/documents/${encodeURIComponent(r.source_file)}#page=${r.pdf_page}">打开 ${esc(r.report_period)} · PDF 第 ${r.pdf_page} 页 ↗</a></article>`).join('');document.querySelector('#time').textContent=`${((performance.now()-start)/1000).toFixed(1)} 秒 · ${data.results.length} 条证据`;answer.style.display='block';}
      catch(error){errorBox.textContent=error.message;errorBox.style.display='block'}finally{submit.disabled=false;loading.style.display='none'}
    });
  </script>
</body>
</html>
